global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'vg-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'vg-worker-weapon'
    static_configs:
      - targets: ['worker-weapon:8001']

  - job_name: 'vg-worker-fire'
    static_configs:
      - targets: ['worker-fire:8002']

  - job_name: 'vg-worker-fall'
    static_configs:
      - targets: ['worker-fall:8003']

  - job_name: 'vg-camera'
    static_configs:
      - targets: ['camera:8004']

  - job_name: 'vg-ecs'
    static_configs:
      - targets: ['ecs:8005']

  - job_name: 'vg-alerts'
    static_configs:
      - targets: ['alert-worker:8006']

  - job_name: 'vg-clip-recorder'
    static_configs:
      - targets: ['clip-recorder:8007']

  - job_name: 'vg-redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'vg-postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
