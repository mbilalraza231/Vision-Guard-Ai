; ============================================================
; VisionGuard AI - Alerts Worker Supervisor Configuration
; ============================================================
; Alerts Worker - Consumes from vg:events:finalized stream.
; Dispatches notifications (WhatsApp, Email) for classified events.
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/visionguard/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/visionguard
user=vguser

[program:alerts-worker]
command=python -m alerts.worker
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/visionguard/alerts-worker.stdout.log
stderr_logfile=/var/log/visionguard/alerts-worker.stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PYTHONPATH="/app"

; Alerts worker needs time to dispatch pending notifications on shutdown
stopasgroup=true
killasgroup=true
