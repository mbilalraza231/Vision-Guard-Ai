# ============================================================
# VisionGuard AI - Docker Compose (Edge Deployment)
# ============================================================
# Production orchestration for VisionGuard AI system.
#
# Services:
# - redis: Message broker (mandatory)
# - backend: FastAPI control plane
# - ecs: Event Classification Service (SINGLETON)
# - camera: Camera capture service
# - worker: AI inference workers (scalable)
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d --scale worker=3  # Scale workers
#   docker-compose down               # Stop all services
#
# ============================================================

networks:
  visionguard:
    driver: bridge
    name: visionguard-network

volumes:
  redis-data:
    name: vg-redis-data
  vg-data:
    name: vg-app-data
  vg-db-data:
    name: vg-db-data
  vg-logs:
    name: vg-logs
  vg-frames:
    name: vg-shared-frames

services:
  # ============================================================
  # PostgreSQL - Relational Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: vg-postgres
    restart: unless-stopped
    networks:
      - visionguard
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-visionguard}
    volumes:
      - vg-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visionguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Database Initializer
  # ============================================================
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vg-db-init
    networks:
      - visionguard
    environment:
      - VG_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - VG_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - VG_POSTGRES_DB=${POSTGRES_DB:-visionguard}
      - VG_POSTGRES_HOST=postgres
      - VG_POSTGRES_PORT=5432
    command: python db/init_postgres.py
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # PERMISSION INITIALIZER
  # ============================================================
  init-perms:
    image: alpine:latest
    container_name: vg-init-perms
    user: "root"
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
    command: >
      sh -c "mkdir -p /data/visionguard/detections /data/visionguard/clips &&
             chown -R 1000:1000 /data /var/log/visionguard"

  # ============================================================
  # Redis - Message Broker
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: vg-redis
    restart: unless-stopped
    networks:
      - visionguard
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================
  # Backend Supervisor
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vg-backend
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - visionguard
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app:rw
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - ./cameras.json:/app/cameras.json:rw
      - vg-frames:/shared-frames
    environment:
      - VG_HOST=0.0.0.0
      - VG_PORT=8000
      - VG_REDIS_HOST=redis
      - VG_REDIS_PORT=6379
      - VG_ENVIRONMENT=${VG_ENVIRONMENT:-production}
      - VG_RUNTIME_MODE=docker
      - VG_LOG_LEVEL=${VG_LOG_LEVEL:-INFO}
      - VG_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - VG_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - VG_POSTGRES_DB=${POSTGRES_DB:-visionguard}
      - VG_POSTGRES_HOST=postgres
      - VG_POSTGRES_PORT=5432
      - SHARED_FRAMES_DIR=/shared-frames
      - VG_STORAGE_TOTAL_MB=512000
      - CAMERA_CONFIG_PATH=/app/cameras.json
      - VG_SYSTEM_MEMORY_GB=${VG_SYSTEM_MEMORY_GB:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # Event Classification Service
  # ============================================================
  ecs:
    image: visionguardaiantigravity-ecs:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.ecs
    container_name: vg-ecs
    restart: unless-stopped
    stop_grace_period: 20s
    networks:
      - visionguard
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - vg-frames:/shared-frames
    environment:
      - ECS_REDIS_HOST=redis
      - ECS_REDIS_PORT=6379
      - ECS_LOG_LEVEL=${ECS_LOG_LEVEL:-INFO}
      - ECS_RESUME_FROM_LATEST=true
      - ECS_MAX_SOURCE_LAG_SEC=20
      - ECS_WEAPON_THRESHOLD=0.30
      - ECS_FIRE_THRESHOLD=0.30
      - ECS_FALL_THRESHOLD=0.30
      - VG_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - VG_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - VG_POSTGRES_DB=${POSTGRES_DB:-visionguard}
      - VG_POSTGRES_HOST=postgres
      - VG_POSTGRES_PORT=5432
      - SHARED_FRAMES_DIR=/shared-frames
      - ECS_HARD_TTL_SECONDS=30.0
      - ECS_CORRELATION_WINDOW_MS=500
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Clip Recorder
  # ============================================================
  clip-recorder:
    build:
      context: .
      dockerfile: docker/Dockerfile.clip
    container_name: vg-clip-recorder
    restart: unless-stopped
    networks:
      - visionguard
    volumes:
      - .:/app:rw
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIP_PRE_SECONDS=${CLIP_PRE_SECONDS:-10}
      - CLIP_POST_SECONDS=${CLIP_POST_SECONDS:-10}
      - CLIP_ENABLE_BACKGROUND_BUFFER=${CLIP_ENABLE_BACKGROUND_BUFFER:-false}
      - CAMERA_FPS=${CAMERA_FPS:-5}
      - VG_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - VG_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - VG_POSTGRES_DB=${POSTGRES_DB:-visionguard}
      - VG_POSTGRES_HOST=postgres
      - VG_POSTGRES_PORT=5432
      - LOG_LEVEL=${VG_LOG_LEVEL:-INFO}
      - SNAPSHOT_DIR=/data/visionguard/detections
      - CLIP_DIR=/data/visionguard/clips
      - CAMERA_SOURCE=${CAMERA_SOURCE:-}
      - BACKEND_URL=http://vg-backend:8000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      init-perms:
        condition: service_completed_successfully

  camera:
    build:
      context: .
      dockerfile: docker/Dockerfile.camera
    container_name: vg-camera
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: 256m
    ipc: host
    networks:
      - visionguard
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - vg-frames:/shared-frames
      - ./test-video.mp4:/app/test-video.mp4:ro
      - ./cameras.json:/app/cameras.json:rw
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CAMERA_CONFIG_PATH=/app/cameras.json
      - CAMERA_RECONNECT_RETRIES=${CAMERA_RECONNECT_RETRIES:-5}
      - CAMERA_RECONNECT_DELAY_SEC=${CAMERA_RECONNECT_DELAY_SEC:-5}
      - CAMERA_RECONNECT_MAX_DELAY_SEC=${CAMERA_RECONNECT_MAX_DELAY_SEC:-60}
      - CAMERA_RECONNECT_BACKOFF_MULTIPLIER=${CAMERA_RECONNECT_BACKOFF_MULTIPLIER:-2.0}
      - LOG_LEVEL=${CAMERA_LOG_LEVEL:-INFO}
      - SHARED_FRAMES_DIR=/shared-frames
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, sys, redis; r=redis.Redis(host=os.getenv('REDIS_HOST','redis'), port=int(os.getenv('REDIS_PORT','6379'))); r.ping(); ok=False; for pid in [p for p in os.listdir('/proc') if p.isdigit()]:     try:         cmd=open(f'/proc/{pid}/cmdline','rb').read().decode('utf-8','ignore')         if 'camera_capture.main' in cmd:             ok=True             break     except Exception:         pass sys.exit(0 if ok else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  worker-weapon:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: vg-worker-weapon
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - visionguard
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - vg-frames:/shared-frames
    tmpfs:
      - /tmp:size=100M
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_MODEL_TYPE=weapon
      - WORKER_CONFIDENCE_THRESHOLD=0.70
      - ONNX_EXECUTION_PROVIDER=CPUExecutionProvider
      - LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - SHARED_FRAMES_DIR=/shared-frames
      - SNAPSHOT_DIR=/data/visionguard/detections
      - DETECTION_IMAGE_DIR=/data/visionguard/detections
    depends_on:
      redis:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, sys, redis; r=redis.Redis(host=os.getenv('REDIS_HOST','redis'), port=int(os.getenv('REDIS_PORT','6379'))); r.ping(); ok=any('ai_worker.main' in open(f'/proc/{p}/cmdline','rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')); sys.exit(0 if ok else 1)" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  worker-fire:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-fire
    container_name: vg-worker-fire
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - visionguard
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - vg-frames:/shared-frames
    tmpfs:
      - /tmp:size=100M
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_MODEL_TYPE=fire
      - WORKER_MODEL_PATH=/app/models/fire_openvino_model
      - WORKER_CONFIDENCE_THRESHOLD=0.40
      - WORKER_IOU_THRESHOLD=0.45
      - WORKER_INPUT_WIDTH=416
      - WORKER_INPUT_HEIGHT=416
      - WORKER_AGNOSTIC_NMS=true
      - WORKER_ALLOWED_CLASS_IDS=0
      - LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - SHARED_FRAMES_DIR=/shared-frames
      - SNAPSHOT_DIR=/data/visionguard/detections
      - DETECTION_IMAGE_DIR=/data/visionguard/detections
    depends_on:
      redis:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, sys, redis; r=redis.Redis(host=os.getenv('REDIS_HOST','redis'), port=int(os.getenv('REDIS_PORT','6379'))); r.ping(); ok=any('ai_worker.main' in open(f'/proc/{p}/cmdline','rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')); sys.exit(0 if ok else 1)" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  worker-fall:
    image: visionguardaiantigravity-worker-fall:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: vg-worker-fall
    restart: unless-stopped
    stop_grace_period: 35s
    networks:
      - visionguard
    volumes:
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
      - vg-frames:/shared-frames
    tmpfs:
      - /tmp:size=100M
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_MODEL_TYPE=fall
      - WORKER_CONFIDENCE_THRESHOLD=0.80
      - ONNX_EXECUTION_PROVIDER=CPUExecutionProvider
      - LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
      - SHARED_FRAMES_DIR=/shared-frames
      - SNAPSHOT_DIR=/data/visionguard/detections
      - DETECTION_IMAGE_DIR=/data/visionguard/detections
    depends_on:
      redis:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import os, sys, redis; r=redis.Redis(host=os.getenv('REDIS_HOST','redis'), port=int(os.getenv('REDIS_PORT','6379'))); r.ping(); ok=any('ai_worker.main' in open(f'/proc/{p}/cmdline','rb').read().decode('utf-8','ignore') for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')); sys.exit(0 if ok else 1)" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  debug-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: vg-debug-ui
    restart: unless-stopped
    networks:
      - visionguard
    ports:
      - "${DEBUG_UI_PORT:-8501}:8501"
    volumes:
      - ./data:/data/visionguard
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VG_DB_PATH=/data/visionguard/events.db
      - VG_STREAM_NAME=vg:ai:results
      - VG_REFRESH_SEC=1.5
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - debug

  alert-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.alerts
    container_name: vg-alert-worker
    restart: unless-stopped
    networks:
      - visionguard
    volumes:
      - .:/app:rw
      - vg-data:/data/visionguard
      - vg-logs:/var/log/visionguard
    environment:
      - VG_REDIS_HOST=redis
      - VG_REDIS_PORT=6379
      - VG_POSTGRES_HOST=postgres
      - VG_POSTGRES_PORT=5432
      - VG_POSTGRES_DB=visionguard
      - VG_POSTGRES_USER=postgres
      - VG_POSTGRES_PASSWORD=postgres
      - VG_TWILIO_SID=${VG_TWILIO_SID}
      - VG_TWILIO_AUTH_TOKEN=${VG_TWILIO_AUTH_TOKEN}
      - VG_TWILIO_FROM=${VG_TWILIO_FROM}
      - VG_GMAIL_USER=${VG_GMAIL_USER}
      - VG_GMAIL_PASSWORD=${VG_GMAIL_PASSWORD}
      - VG_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
